<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CumpleGamer — Control de Inventario</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f5f5f4; --bg-tertiary: #eeede9;
      --text-primary: #1c1c1a; --text-secondary: #6b6b67;
      --border: rgba(0,0,0,0.12); --border-md: rgba(0,0,0,0.2);
      --radius-md: 8px; --radius-lg: 12px;
      --green-bg: #EAF3DE; --green-text: #3B6D11;
      --amber-bg: #FAEEDA; --amber-text: #854F0B;
      --red-bg: #FCEBEB; --red-text: #A32D2D;
      --info-bg: #E6F1FB; --info-text: #185FA5;
      --warn-bg: #FAEEDA; --warn-text: #854F0B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1c; --bg-secondary: #2a2a27; --bg-tertiary: #141412;
        --text-primary: #f0efea; --text-secondary: #9a9a94;
        --border: rgba(255,255,255,0.1); --border-md: rgba(255,255,255,0.2);
        --green-bg: #173404; --green-text: #C0DD97;
        --amber-bg: #412402; --amber-text: #FAC775;
        --red-bg: #501313; --red-text: #F7C1C1;
        --info-bg: #042C53; --info-text: #85B7EB;
        --warn-bg: #412402; --warn-text: #FAC775;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; }

    .topbar { background: #1a1a2e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { color: #e2c94e; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .sync-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); font-size: 12px; color: rgba(255,255,255,0.8); cursor: pointer; }
    .sync-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .sync-btn.loading { opacity: 0.5; pointer-events: none; }
    .sync-time { font-size: 11px; color: rgba(255,255,255,0.4); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex-shrink: 0; transition: background 0.3s; }
    .conn-dot.online { background: #1D9E75; }
    .conn-dot.offline { background: #E24B4A; }

    .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
    @media (max-width:600px) { .stats { grid-template-columns: repeat(2,1fr); } }
    .stat { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-val { font-size: 24px; font-weight: 600; color: var(--text-primary); }
    .stat-val.green { color: #1D9E75; } .stat-val.amber { color: #BA7517; }

    .alert-banner { background: var(--amber-bg); border: 0.5px solid #EF9F27; border-radius: var(--radius-md); padding: 10px 16px; margin-bottom: 16px; font-size: 13px; color: var(--amber-text); display: none; }
    .alert-banner.show { display: block; }

    .tab-bar { display: flex; gap: 4px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 9px; text-align: center; font-size: 13px; border-radius: 6px; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); transition: all 0.15s; }
    .tab.active { background: var(--bg-primary); color: var(--text-primary); font-weight: 500; border: 0.5px solid var(--border); }
    .tab-content { display: none; } .tab-content.active { display: block; }

    .card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
    .scan-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .field { flex: 1; min-width: 140px; }
    .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select { width: 100%; height: 38px; padding: 0 12px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; }
    .field input:focus, .field select:focus { outline: none; border-color: #e2c94e; box-shadow: 0 0 0 2px rgba(226,201,78,0.2); }
    .field input { font-family: monospace; letter-spacing: 0.05em; }
    .search-btn { height: 38px; padding: 0 22px; background: #1a1a2e; color: #e2c94e; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .search-btn:hover { background: #26215C; }

    .result-box { margin-top: 16px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 16px; display: none; }
    .result-box.show { display: block; }
    .result-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .item-code { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-secondary); font-family: monospace; text-transform: uppercase; margin-bottom: 2px; }
    .item-name { font-size: 17px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .item-dif { font-size: 13px; color: var(--text-secondary); margin-top: 3px; font-style: italic; }
    .item-cant { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
    .badge-green { background: var(--green-bg); color: var(--green-text); }
    .badge-amber { background: var(--amber-bg); color: var(--amber-text); }
    .badge-red { background: var(--red-bg); color: var(--red-text); }
    .action-row { display: flex; gap: 8px; }
    .btn-egreso { flex: 1; padding: 10px; background: var(--red-bg); color: var(--red-text); border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-egreso:hover { filter: brightness(0.95); }
    .btn-regreso { flex: 1; padding: 10px; background: var(--green-bg); color: var(--green-text); border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-regreso:hover { filter: brightness(0.95); }
    .btn-disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .res-msg { font-size: 12px; text-align: center; margin-top: 10px; display: none; font-weight: 500; }

    .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-row select { flex: 1; min-width: 140px; height: 36px; padding: 0 10px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; }
    .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 12px; }

    .log-item { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 11px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .log-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .log-dot.out { background: #E24B4A; } .log-dot.in { background: #1D9E75; }
    .log-info { flex: 1; min-width: 0; }
    .log-name { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-code { font-size: 10px; color: var(--text-secondary); font-family: monospace; }
    .log-dif { font-size: 11px; color: var(--text-secondary); font-style: italic; }
    .log-sub { font-size: 12px; color: var(--text-secondary); }
    .log-time { text-align: right; flex-shrink: 0; }
    .log-hour { font-size: 13px; font-weight: 600; color: var(--text-primary); display: block; }
    .log-date { font-size: 11px; color: var(--text-secondary); }

    .inv-item { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .inv-code { font-size: 10px; font-weight: 600; color: var(--text-secondary); font-family: monospace; letter-spacing: 0.06em; width: 110px; flex-shrink: 0; }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .inv-dif { font-size: 11px; color: var(--text-secondary); font-style: italic; }
    .inv-cant { font-size: 11px; color: var(--text-secondary); width: 40px; text-align: center; flex-shrink: 0; }

    .no-results { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 14px; }
    .no-results i { font-size: 28px; display: block; margin-bottom: 8px; }
    .err-box { background: var(--red-bg); border: 0.5px solid #F09595; border-radius: var(--radius-md); padding: 12px 16px; font-size: 13px; color: var(--red-text); margin-top: 12px; display: none; }
    .err-box.show { display: block; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #e2c94e; border-radius: 50%; animation: spin 0.6s linear infinite; }
    .spinner-dark { border: 2px solid var(--border); border-top-color: var(--text-secondary); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-overlay { text-align: center; padding: 3rem; color: var(--text-secondary); font-size: 14px; }

    .dl-btn { display: flex; align-items: center; gap: 5px; padding: 0 14px; height: 36px; white-space: nowrap; background: #1a1a2e; color: #e2c94e; border: none; border-radius: var(--radius-md); font-size: 12px; font-weight: 500; cursor: pointer; }
    .dl-btn:hover { background: #26215C; }
    .dl-btn-xls { background: #1a3a1a; color: #8fd68f; }
    .dl-btn-xls:hover { background: #1f481f; }

    .report-day { margin-bottom: 24px; }
    .report-day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
    .report-day-title { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.03em; }
    .report-day-count { font-size: 11px; color: var(--text-secondary); background: var(--bg-secondary); padding: 3px 10px; border-radius: 20px; }
    .report-table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 0.5px solid var(--border); }
    table.report-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg-primary); }
    table.report-table thead tr { background: var(--bg-secondary); }
    table.report-table th { text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 0.5px solid var(--border); white-space: nowrap; }
    table.report-table td { padding: 9px 14px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); vertical-align: middle; }
    table.report-table tr:last-child td { border-bottom: none; }
    table.report-table tr:hover td { background: var(--bg-secondary); }
    .td-code { font-family: monospace; font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
    .td-dif { font-size: 11px; color: var(--text-secondary); font-style: italic; }
    .td-hora { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .realtime-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255,255,255,0.5); }
    .pulse { width: 6px; height: 6px; border-radius: 50%; background: #1D9E75; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  </style>
</head>
<body>

<div class="topbar">
  <span class="logo">🎮 CumpleGamer — Inventario</span>
  <div class="topbar-right">
    <span class="realtime-badge" id="rt-badge"><span class="conn-dot" id="conn-dot"></span> Conectando...</span>
    <span class="sync-time" id="sync-time">Sin sync</span>
    <button class="sync-btn" id="sync-btn" onclick="syncInventario(true)">
      <i class="ti ti-refresh"></i> Sincronizar planilla
    </button>
  </div>
</div>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Disponibles</div><div class="stat-val green" id="stat-disp">—</div></div>
    <div class="stat"><div class="stat-label">En uso</div><div class="stat-val amber" id="stat-uso">—</div></div>
    <div class="stat"><div class="stat-label">Mov. hoy</div><div class="stat-val" id="stat-mov">—</div></div>
  </div>

  <div class="alert-banner" id="alert-banner"></div>

  <div class="tab-bar">
    <button class="tab active" onclick="showTab('scan',this)"><i class="ti ti-qrcode"></i> Escanear</button>
    <button class="tab" onclick="showTab('log',this)"><i class="ti ti-history"></i> Historial</button>
    <button class="tab" onclick="showTab('inv',this)"><i class="ti ti-packages"></i> Inventario</button>
    <button class="tab" onclick="showTab('report',this)"><i class="ti ti-table"></i> Reportes</button>
  </div>

  <!-- SCAN -->
  <div id="tab-scan" class="tab-content active">
    <div class="card">
      <div class="scan-row">
        <div class="field" style="flex:2;min-width:160px;">
          <label>Código del artículo</label>
          <input type="text" id="codigo-input" placeholder="Ej: CON-PS5-01"
            oninput="this.value=this.value.toUpperCase()"
            onkeydown="if(event.key==='Enter')buscarArticulo()">
        </div>
        <div class="field">
          <label>Operador</label>
          <select id="operador-select">
            <option value="">Seleccionar...</option>
            <option>Camilo</option>
            <option>Cristóbal</option>
            <option>Daniel</option>
            <option>Diego</option>
            <option>Gonzalo</option>
            <option>Hugo</option>
            <option>Italo</option>
            <option>Matías</option>
            <option>Raúl</option>
          </select>
        </div>
        <button class="search-btn" onclick="buscarArticulo()"><i class="ti ti-search"></i> Buscar</button>
      </div>
      <div id="scan-loading" class="load-overlay" style="display:none;">
        <span class="spinner spinner-dark"></span><br>Conectando con la planilla...
      </div>
      <div id="scan-err" class="err-box"></div>
      <div class="result-box" id="result-box">
        <div class="result-top">
          <div>
            <div class="item-code" id="res-code"></div>
            <div class="item-name" id="res-name"></div>
            <div class="item-dif"  id="res-dif"></div>
            <div class="item-cant" id="res-cant"></div>
          </div>
          <span class="badge" id="res-badge"></span>
        </div>
        <div class="action-row">
          <button class="btn-egreso" id="btn-egreso" onclick="registrarMovimiento('egreso')"><i class="ti ti-arrow-up-right"></i> Registrar egreso</button>
          <button class="btn-regreso" id="btn-regreso" onclick="registrarMovimiento('regreso')"><i class="ti ti-arrow-down-left"></i> Registrar reingreso</button>
        </div>
        <div class="res-msg" id="res-msg"></div>
      </div>
    </div>
  </div>

  <!-- LOG -->
  <div id="tab-log" class="tab-content">
    <div class="filter-row">
      <select id="filter-op" onchange="renderLog()">
        <option value="">Todos los operadores</option>
        <option>Camilo</option><option>Cristóbal</option><option>Daniel</option>
        <option>Diego</option><option>Gonzalo</option><option>Hugo</option>
        <option>Italo</option><option>Matías</option><option>Raúl</option>
      </select>
      <select id="filter-tipo" onchange="renderLog()">
        <option value="">Egresos y reingresos</option>
        <option value="egreso">Solo egresos</option>
        <option value="regreso">Solo reingresos</option>
      </select>
    </div>
    <div class="section-title">Registro de movimientos</div>
    <div id="log-list"></div>
  </div>

  <!-- INV -->
  <div id="tab-inv" class="tab-content">
    <div class="filter-row">
      <select id="filter-item" onchange="renderInventario()"><option value="">Todos los items</option></select>
      <select id="filter-est" onchange="renderInventario()">
        <option value="">Todos los estados</option>
        <option value="disponible">Disponibles</option>
        <option value="en_uso">En uso</option>
      </select>
    </div>
    <div class="section-title">Artículos en planilla</div>
    <div id="inv-list"></div>
  </div>

  <!-- REPORT -->
  <div id="tab-report" class="tab-content">
    <div class="filter-row">
      <select id="report-filter-op" onchange="renderReport()">
        <option value="">Todos los operadores</option>
        <option>Camilo</option><option>Cristóbal</option><option>Daniel</option>
        <option>Diego</option><option>Gonzalo</option><option>Hugo</option>
        <option>Italo</option><option>Matías</option><option>Raúl</option>
      </select>
      <select id="report-filter-tipo" onchange="renderReport()">
        <option value="">Egresos y reingresos</option>
        <option value="egreso">Solo egresos</option>
        <option value="regreso">Solo reingresos</option>
      </select>
      <button class="dl-btn" onclick="descargarCSV()"><i class="ti ti-file-type-csv"></i> CSV</button>
      <button class="dl-btn dl-btn-xls" onclick="descargarExcel()"><i class="ti ti-file-spreadsheet"></i> Excel</button>
    </div>
    <div id="report-container"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBzIb_cGxmS43Xyz5vLtiNgyXm1tA7Zp9U",
    authDomain: "cumple-gamer.firebaseapp.com",
    projectId: "cumple-gamer",
    storageBucket: "cumple-gamer.firebasestorage.app",
    messagingSenderId: "489208760103",
    appId: "1:489208760103:web:3c7924d36952ada6284b02"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRao9gCsD0yBe80DQgBQokKGEXl1fYfWbGs23FGayz0dZost7E22PRmG1jEH_ylyCB7LvjYpcnxVVz/pub?output=csv';

  let inventory  = [];
  let log        = [];
  let statusMap  = {};
  let foundItem  = null;
  let activeTab  = 'scan';

  const now     = () => new Date();
  const fmtDate = d => d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fmtTime = d => d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const esc     = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ── Firestore: escuchar movimientos en tiempo real ──────────────────────────
  function initRealtimeListener() {
    const q = query(collection(db, 'movimientos'), orderBy('ts', 'desc'));
    onSnapshot(q,
      snapshot => {
        log = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
        // reconstruir statusMap desde el log
        statusMap = {};
        // recorrer de más antiguo a más nuevo para que el último estado gane
        [...log].reverse().forEach(e => {
          statusMap[e.codigo] = e.tipo === 'egreso' ? 'en_uso' : 'disponible';
        });
        // aplicar estados al inventario
        inventory.forEach(i => { i.estado = statusMap[i.codigo] || 'disponible'; });
        updateStats();
        if (activeTab === 'log')    renderLog();
        if (activeTab === 'report') renderReport();
        if (activeTab === 'inv')    renderInventario();
        // actualizar resultado visible si hay un artículo buscado
        if (foundItem) {
          foundItem.estado = statusMap[foundItem.codigo] || 'disponible';
          refreshResultBadge();
        }
        setConnStatus(true);
      },
      err => {
        console.error('Firestore error:', err);
        setConnStatus(false);
      }
    );
  }

  function setConnStatus(online) {
    const dot   = document.getElementById('conn-dot');
    const badge = document.getElementById('rt-badge');
    if (!dot || !badge) return;
    if (online) {
      dot.className = 'conn-dot online';
      badge.innerHTML = '<span class="conn-dot online"></span> Tiempo real';
    } else {
      dot.className = 'conn-dot offline';
      badge.innerHTML = '<span class="conn-dot offline"></span> Sin conexión';
    }
  }

  // ── Google Sheets ───────────────────────────────────────────────────────────
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return { headers:[], rows:[] };
    const parseRow = row => {
      const res=[]; let inQ=false, cur='';
      for (let i=0;i<row.length;i++) {
        const ch=row[i];
        if (ch==='"'){inQ=!inQ;}
        else if (ch===','&&!inQ){res.push(cur.trim());cur='';}
        else{cur+=ch;}
      }
      res.push(cur.trim());
      return res;
    };
    return { headers: parseRow(lines[0]), rows: lines.slice(1).map(parseRow).filter(r=>r.some(c=>c)) };
  }

  window.syncInventario = async function(manual=false) {
    const btn    = document.getElementById('sync-btn');
    const timeEl = document.getElementById('sync-time');
    const errBox = document.getElementById('scan-err');
    const loadEl = document.getElementById('scan-loading');
    btn.classList.add('loading');
    btn.innerHTML = '<span class="spinner"></span> Sincronizando...';
    errBox.classList.remove('show');
    if (!manual) loadEl.style.display = 'block';
    try {
      const resp = await fetch(CSV_URL + '&_=' + Date.now());
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();
      const { headers, rows } = parseCSV(text);
      const iCod  = headers.findIndex(h=>h.trim()==='CODIGO');
      const iItem = headers.findIndex(h=>h.trim()==='ITEM MARCA_');
      const iDif  = headers.findIndex(h=>h.trim()==='Diferenciador');
      const iCant = headers.findIndex(h=>h.trim()==='Cantidad');
      if (iCod < 0) throw new Error('No se encontró la columna CODIGO.');
      inventory = rows
        .filter(r=>r[iCod]&&r[iCod].trim())
        .map(r=>({
          codigo:        (r[iCod]||'').trim().toUpperCase(),
          nombre:        (r[iItem]||'').trim(),
          diferenciador: (iDif>=0?(r[iDif]||'').trim():''),
          cantidad:      (iCant>=0?(r[iCant]||'1').trim():'1'),
          estado:        statusMap[(r[iCod]||'').trim().toUpperCase()] || 'disponible'
        }));
      populateItemFilter();
      updateStats();
      timeEl.textContent = 'Planilla: ' + fmtTime(now()) + ' · ' + inventory.length + ' art.';
      if (manual) {
        const rb = document.getElementById('result-box');
        document.getElementById('res-code').textContent = '';
        document.getElementById('res-name').textContent = '✓ Planilla sincronizada';
        document.getElementById('res-dif').textContent  = inventory.length + ' artículos cargados';
        document.getElementById('res-cant').textContent = '';
        document.getElementById('res-badge').textContent = '';
        document.getElementById('res-badge').className = 'badge';
        document.getElementById('btn-egreso').classList.add('btn-disabled');
        document.getElementById('btn-regreso').classList.add('btn-disabled');
        document.getElementById('res-msg').style.display = 'none';
        rb.classList.add('show');
        foundItem = null;
      }
    } catch(e) {
      errBox.textContent = 'No se pudo cargar la planilla: ' + e.message;
      errBox.classList.add('show');
      timeEl.textContent = 'Error al sincronizar planilla';
    } finally {
      btn.classList.remove('loading');
      btn.innerHTML = '<i class="ti ti-refresh"></i> Sincronizar planilla';
      loadEl.style.display = 'none';
    }
  };

  function populateItemFilter() {
    const items = [...new Set(inventory.map(i=>i.nombre))].sort();
    const sel = document.getElementById('filter-item');
    sel.innerHTML = '<option value="">Todos los items</option>' +
      items.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
  }

  function updateStats() {
    const disp  = inventory.filter(i=>i.estado==='disponible').length;
    const uso   = inventory.filter(i=>i.estado==='en_uso').length;
    const today = fmtDate(now());
    const mov   = log.filter(l=>l.fecha===today).length;
    document.getElementById('stat-total').textContent = inventory.length;
    document.getElementById('stat-disp').textContent  = disp;
    document.getElementById('stat-uso').textContent   = uso;
    document.getElementById('stat-mov').textContent   = mov;
    const afuera = log.filter(l=>l.tipo==='egreso'&&!l.reingresado).length;
    const al = document.getElementById('alert-banner');
    if (afuera > 0) {
      al.textContent = '⚠ ' + afuera + ' artículo(s) fuera sin reingreso registrado.';
      al.classList.add('show');
    } else { al.classList.remove('show'); }
  }

  window.showTab = function(name, el) {
    activeTab = name;
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    el.classList.add('active');
    if (name==='log')    renderLog();
    if (name==='inv')    renderInventario();
    if (name==='report') renderReport();
  };

  window.buscarArticulo = function() {
    const codigo = document.getElementById('codigo-input').value.trim().toUpperCase();
    document.getElementById('scan-err').classList.remove('show');
    document.getElementById('res-msg').style.display = 'none';
    if (!codigo) return;
    const item = inventory.find(i=>i.codigo===codigo);
    if (!item) {
      showResult({ codigo, nombre:'Artículo no encontrado', diferenciador:'Verificá el código o sincronizá si lo acabás de agregar.', cantidad:'', estado:null }, true);
      foundItem = null;
      return;
    }
    foundItem = item;
    showResult(item, false);
  };

  function showResult(item, noAction) {
    document.getElementById('res-code').textContent = item.codigo;
    document.getElementById('res-name').textContent = item.nombre;
    document.getElementById('res-dif').textContent  = item.diferenciador || '';
    document.getElementById('res-cant').textContent = item.cantidad ? 'Cantidad: ' + item.cantidad : '';
    const badge = document.getElementById('res-badge');
    const btnE  = document.getElementById('btn-egreso');
    const btnR  = document.getElementById('btn-regreso');
    if (noAction || !item.estado) {
      badge.textContent=''; badge.className='badge';
      btnE.classList.add('btn-disabled'); btnR.classList.add('btn-disabled');
    } else if (item.estado==='disponible') {
      badge.textContent='Disponible'; badge.className='badge badge-green';
      btnE.classList.remove('btn-disabled'); btnR.classList.add('btn-disabled');
    } else {
      badge.textContent='En uso'; badge.className='badge badge-amber';
      btnE.classList.add('btn-disabled'); btnR.classList.remove('btn-disabled');
    }
    document.getElementById('result-box').classList.add('show');
  }

  function refreshResultBadge() {
    if (!foundItem) return;
    const badge = document.getElementById('res-badge');
    const btnE  = document.getElementById('btn-egreso');
    const btnR  = document.getElementById('btn-regreso');
    if (foundItem.estado === 'disponible') {
      badge.textContent='Disponible'; badge.className='badge badge-green';
      btnE.classList.remove('btn-disabled'); btnR.classList.add('btn-disabled');
    } else {
      badge.textContent='En uso'; badge.className='badge badge-amber';
      btnE.classList.add('btn-disabled'); btnR.classList.remove('btn-disabled');
    }
  }

  window.registrarMovimiento = async function(tipo) {
    if (!foundItem) return;
    const operador = document.getElementById('operador-select').value;
    const msg = document.getElementById('res-msg');
    if (!operador) {
      msg.textContent='Seleccioná un operador antes de registrar.';
      msg.style.color='#E24B4A'; msg.style.display='block';
      return;
    }
    const ahora = now();

    // Calcular reingresado: si es egreso = false; si es regreso, marcar el egreso anterior
    const entry = {
      codigo:        foundItem.codigo,
      nombre:        foundItem.nombre,
      diferenciador: foundItem.diferenciador || '',
      tipo,
      operador,
      fecha:         fmtDate(ahora),
      hora:          fmtTime(ahora),
      ts:            ahora.toISOString(),
      reingresado:   false
    };

    try {
      // Si es reingreso, marcar el egreso anterior como reingresado
      if (tipo === 'regreso') {
        const egresoAnterior = log.find(l=>l.codigo===foundItem.codigo&&l.tipo==='egreso'&&!l.reingresado);
        if (egresoAnterior && egresoAnterior.firestoreId) {
          await setDoc(doc(db,'movimientos',egresoAnterior.firestoreId), { reingresado: true }, { merge: true });
        }
      }
      await addDoc(collection(db,'movimientos'), entry);

      msg.textContent = tipo==='egreso'
        ? '✓ Egreso guardado a las '+fmtTime(ahora)+' por '+operador
        : '✓ Reingreso guardado a las '+fmtTime(ahora)+' por '+operador;
      msg.style.color = tipo==='egreso' ? '#E24B4A' : '#1D9E75';
      msg.style.display = 'block';
      // El listener onSnapshot actualizará el estado automáticamente
    } catch(e) {
      msg.textContent = 'Error al guardar: ' + e.message;
      msg.style.color = '#E24B4A';
      msg.style.display = 'block';
    }
  };

  function renderLog() {
    const fOp   = document.getElementById('filter-op').value;
    const fTipo = document.getElementById('filter-tipo').value;
    let entries = log;
    if (fOp)   entries = entries.filter(l=>l.operador===fOp);
    if (fTipo) entries = entries.filter(l=>l.tipo===fTipo);
    const el = document.getElementById('log-list');
    if (!entries.length) {
      el.innerHTML='<div class="no-results"><i class="ti ti-history"></i>Sin registros aún</div>';
      return;
    }
    el.innerHTML = entries.map(l=>`
      <div class="log-item">
        <div class="log-dot ${l.tipo==='egreso'?'out':'in'}"></div>
        <div class="log-info">
          <div class="log-name">${esc(l.nombre)} <span class="log-code">${esc(l.codigo)}</span></div>
          ${l.diferenciador?`<div class="log-dif">${esc(l.diferenciador)}</div>`:''}
          <div class="log-sub">${l.tipo==='egreso'?'Egreso':'Reingreso'} · ${esc(l.operador)}</div>
        </div>
        <div class="log-time">
          <span class="log-hour">${esc(l.hora)}</span>
          <span class="log-date">${esc(l.fecha)}</span>
        </div>
      </div>`).join('');
  }

  function renderInventario() {
    const fItem = document.getElementById('filter-item').value;
    const fEst  = document.getElementById('filter-est').value;
    let items = inventory;
    if (fItem) items = items.filter(i=>i.nombre===fItem);
    if (fEst)  items = items.filter(i=>i.estado===fEst);
    const el = document.getElementById('inv-list');
    if (!items.length) {
      el.innerHTML='<div class="no-results"><i class="ti ti-packages"></i>Sin artículos</div>';
      return;
    }
    el.innerHTML = items.map(i=>`
      <div class="inv-item">
        <div class="inv-code">${esc(i.codigo)}</div>
        <div class="inv-info">
          <div class="inv-name">${esc(i.nombre)}</div>
          ${i.diferenciador?`<div class="inv-dif">${esc(i.diferenciador)}</div>`:''}
        </div>
        <div class="inv-cant">x${esc(i.cantidad)}</div>
        <div><span class="badge ${i.estado==='disponible'?'badge-green':'badge-amber'}">${i.estado==='disponible'?'Disponible':'En uso'}</span></div>
      </div>`).join('');
  }

  function getFilteredLog() {
    const fOp   = document.getElementById('report-filter-op')?.value || '';
    const fTipo = document.getElementById('report-filter-tipo')?.value || '';
    let entries = [...log].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    if (fOp)   entries = entries.filter(l=>l.operador===fOp);
    if (fTipo) entries = entries.filter(l=>l.tipo===fTipo);
    return entries;
  }

  function renderReport() {
    const entries = getFilteredLog();
    const container = document.getElementById('report-container');
    if (!entries.length) {
      container.innerHTML='<div class="no-results"><i class="ti ti-table"></i>Sin movimientos registrados</div>';
      return;
    }
    const byDay = {};
    entries.forEach(e=>{ if(!byDay[e.fecha]) byDay[e.fecha]=[]; byDay[e.fecha].push(e); });
    container.innerHTML = Object.keys(byDay).map(fecha=>{
      const rows = byDay[fecha];
      const rowsHtml = rows.map(e=>`
        <tr>
          <td class="td-hora">${esc(e.hora)}</td>
          <td class="td-code">${esc(e.codigo)}</td>
          <td>
            <div style="font-weight:500;">${esc(e.nombre)}</div>
            ${e.diferenciador?`<div class="td-dif">${esc(e.diferenciador)}</div>`:''}
          </td>
          <td><span class="badge ${e.tipo==='egreso'?'badge-red':'badge-green'}">${e.tipo==='egreso'?'Egreso':'Reingreso'}</span></td>
          <td>${esc(e.operador)}</td>
        </tr>`).join('');
      return `
        <div class="report-day">
          <div class="report-day-header">
            <span class="report-day-title"><i class="ti ti-calendar-event" style="margin-right:6px;"></i>${esc(fecha)}</span>
            <span class="report-day-count">${rows.length} movimiento${rows.length!==1?'s':''}</span>
          </div>
          <div class="report-table-wrap">
            <table class="report-table">
              <thead><tr><th>Hora</th><th>Código</th><th>Artículo</th><th>Tipo</th><th>Operador</th></tr></thead>
              <tbody>${rowsHtml}</tbody>
            </table>
          </div>
        </div>`;
    }).join('');
  }

  window.renderLog       = renderLog;
  window.renderInventario= renderInventario;
  window.renderReport    = renderReport;

  window.descargarCSV = function() {
    const entries = getFilteredLog();
    if (!entries.length) { alert('No hay movimientos para exportar.'); return; }
    const headers = ['Fecha','Hora','Código','Artículo','Diferenciador','Tipo','Operador'];
    const rows = entries.map(e=>[e.fecha,e.hora,e.codigo,e.nombre,e.diferenciador||'',e.tipo==='egreso'?'Egreso':'Reingreso',e.operador]);
    const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='CumpleGamer_Movimientos_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  };

  window.descargarExcel = function() {
    const entries = getFilteredLog();
    if (!entries.length) { alert('No hay movimientos para exportar.'); return; }
    const headers = ['Fecha','Hora','Código','Artículo','Diferenciador','Tipo','Operador'];
    const rows = entries.map(e=>[e.fecha,e.hora,e.codigo,e.nombre,e.diferenciador||'',e.tipo==='egreso'?'Egreso':'Reingreso',e.operador]);
    const xmlRows = [headers,...rows].map(row=>'<Row>'+row.map(v=>`<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`).join('')+'</Row>').join('');
    const xml = `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Movimientos"><Table>${xmlRows}</Table></Worksheet></Workbook>`;
    const blob = new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='CumpleGamer_Movimientos_'+new Date().toISOString().slice(0,10)+'.xls'; a.click();
  };

  // ── Init ────────────────────────────────────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initRealtimeListener();
      syncInventario(false);
    });
  } else {
    initRealtimeListener();
    syncInventario(false);
  }
</script>
</body>

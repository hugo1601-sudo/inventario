<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CumpleGamer — Control de Inventario</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f5f5f4; --bg-tertiary: #eeede9;
      --text-primary: #1c1c1a; --text-secondary: #6b6b67;
      --border: rgba(0,0,0,0.12); --border-md: rgba(0,0,0,0.2);
      --radius-md: 8px; --radius-lg: 12px;
      --green-bg: #EAF3DE; --green-text: #3B6D11;
      --amber-bg: #FAEEDA; --amber-text: #854F0B;
      --red-bg: #FCEBEB; --red-text: #A32D2D;
      --info-bg: #E6F1FB; --info-text: #185FA5;
      --warn-bg: #FAEEDA; --warn-text: #854F0B;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1c; --bg-secondary: #2a2a27; --bg-tertiary: #141412;
        --text-primary: #f0efea; --text-secondary: #9a9a94;
        --border: rgba(255,255,255,0.1); --border-md: rgba(255,255,255,0.2);
        --green-bg: #173404; --green-text: #C0DD97;
        --amber-bg: #412402; --amber-text: #FAC775;
        --red-bg: #501313; --red-text: #F7C1C1;
        --info-bg: #042C53; --info-text: #85B7EB;
        --warn-bg: #412402; --warn-text: #FAC775;
      }
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-tertiary); color: var(--text-primary); min-height: 100vh; }

    .topbar { background: #1a1a2e; padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .logo { color: #e2c94e; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
    .topbar-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .sync-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: var(--radius-md); font-size: 12px; color: rgba(255,255,255,0.8); cursor: pointer; }
    .sync-btn:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .sync-btn.loading { opacity: 0.5; pointer-events: none; }
    .sync-time { font-size: 11px; color: rgba(255,255,255,0.4); }
    .conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #888; flex-shrink: 0; transition: background 0.3s; }
    .conn-dot.online { background: #1D9E75; }
    .conn-dot.offline { background: #E24B4A; }

    .container { max-width: 860px; margin: 0 auto; padding: 24px 16px; }
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 20px; }
    @media (max-width:600px) { .stats { grid-template-columns: repeat(2,1fr); } }
    .stat { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 14px 16px; }
    .stat-label { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-val { font-size: 24px; font-weight: 600; color: var(--text-primary); }
    .stat-val.green { color: #1D9E75; } .stat-val.amber { color: #BA7517; }

    .alert-banner { background: var(--amber-bg); border: 0.5px solid #EF9F27; border-radius: var(--radius-md); padding: 10px 16px; margin-bottom: 16px; font-size: 13px; color: var(--amber-text); display: none; }
    .alert-banner.show { display: block; }

    .tab-bar { display: flex; gap: 4px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 4px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 9px; text-align: center; font-size: 13px; border-radius: 6px; cursor: pointer; border: none; background: transparent; color: var(--text-secondary); transition: all 0.15s; }
    .tab.active { background: var(--bg-primary); color: var(--text-primary); font-weight: 500; border: 0.5px solid var(--border); }
    .tab-content { display: none; } .tab-content.active { display: block; }

    .card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; }
    .scan-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .field { flex: 1; min-width: 140px; }
    .field label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .field input, .field select { width: 100%; height: 38px; padding: 0 12px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: var(--bg-secondary); color: var(--text-primary); font-size: 14px; }
    .field input:focus, .field select:focus { outline: none; border-color: #e2c94e; box-shadow: 0 0 0 2px rgba(226,201,78,0.2); }
    .field input { font-family: monospace; letter-spacing: 0.05em; }
    .search-btn { height: 38px; padding: 0 22px; background: #1a1a2e; color: #e2c94e; border: none; border-radius: var(--radius-md); font-size: 14px; font-weight: 500; cursor: pointer; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
    .search-btn:hover { background: #26215C; }

    .result-box { margin-top: 16px; background: var(--bg-secondary); border-radius: var(--radius-md); padding: 16px; display: none; }
    .result-box.show { display: block; }
    .result-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
    .item-code { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; color: var(--text-secondary); font-family: monospace; text-transform: uppercase; margin-bottom: 2px; }
    .item-name { font-size: 17px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
    .item-dif { font-size: 13px; color: var(--text-secondary); margin-top: 3px; font-style: italic; }
    .item-cant { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
    .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 4px 12px; border-radius: 20px; white-space: nowrap; }
    .badge-green { background: var(--green-bg); color: var(--green-text); }
    .badge-amber { background: var(--amber-bg); color: var(--amber-text); }
    .badge-red { background: var(--red-bg); color: var(--red-text); }
    .action-row { display: flex; gap: 8px; }
    .btn-egreso { flex: 1; padding: 10px; background: var(--red-bg); color: var(--red-text); border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-egreso:hover { filter: brightness(0.95); }
    .btn-regreso { flex: 1; padding: 10px; background: var(--green-bg); color: var(--green-text); border: none; border-radius: var(--radius-md); font-size: 13px; font-weight: 500; cursor: pointer; }
    .btn-regreso:hover { filter: brightness(0.95); }
    .btn-disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
    .res-msg { font-size: 12px; text-align: center; margin-top: 10px; display: none; font-weight: 500; }

    .filter-row { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .filter-row select { flex: 1; min-width: 140px; height: 36px; padding: 0 10px; border: 0.5px solid var(--border-md); border-radius: var(--radius-md); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; }
    .section-title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); margin-bottom: 12px; }

    .log-item { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 11px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
    .log-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .log-dot.out { background: #E24B4A; } .log-dot.in { background: #1D9E75; }
    .log-info { flex: 1; min-width: 0; }
    .log-name { font-size: 13px; font-weight: 500; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .log-code { font-size: 10px; color: var(--text-secondary); font-family: monospace; }
    .log-dif { font-size: 11px; color: var(--text-secondary); font-style: italic; }
    .log-sub { font-size: 12px; color: var(--text-secondary); }
    .log-time { text-align: right; flex-shrink: 0; }
    .log-hour { font-size: 13px; font-weight: 600; color: var(--text-primary); display: block; }
    .log-date { font-size: 11px; color: var(--text-secondary); }

    .inv-item { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-md); padding: 10px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
    .inv-code { font-size: 10px; font-weight: 600; color: var(--text-secondary); font-family: monospace; letter-spacing: 0.06em; width: 110px; flex-shrink: 0; }
    .inv-info { flex: 1; min-width: 0; }
    .inv-name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
    .inv-dif { font-size: 11px; color: var(--text-secondary); font-style: italic; }
    .inv-cant { font-size: 11px; color: var(--text-secondary); width: 40px; text-align: center; flex-shrink: 0; }

    .no-results { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 14px; }
    .no-results i { font-size: 28px; display: block; margin-bottom: 8px; }
    .err-box { background: var(--red-bg); border: 0.5px solid #F09595; border-radius: var(--radius-md); padding: 12px 16px; font-size: 13px; color: var(--red-text); margin-top: 12px; display: none; }
    .err-box.show { display: block; }
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #e2c94e; border-radius: 50%; animation: spin 0.6s linear infinite; }
    .spinner-dark { border: 2px solid var(--border); border-top-color: var(--text-secondary); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-overlay { text-align: center; padding: 3rem; color: var(--text-secondary); font-size: 14px; }

    .dl-btn { display: flex; align-items: center; gap: 5px; padding: 0 14px; height: 36px; white-space: nowrap; background: #1a1a2e; color: #e2c94e; border: none; border-radius: var(--radius-md); font-size: 12px; font-weight: 500; cursor: pointer; }
    .dl-btn:hover { background: #26215C; }
    .dl-btn-xls { background: #1a3a1a; color: #8fd68f; }
    .dl-btn-xls:hover { background: #1f481f; }

    .report-day { margin-bottom: 24px; }
    .report-day-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; padding: 0 2px; }
    .report-day-title { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: 0.03em; }
    .report-day-count { font-size: 11px; color: var(--text-secondary); background: var(--bg-secondary); padding: 3px 10px; border-radius: 20px; }
    .report-table-wrap { overflow-x: auto; border-radius: var(--radius-md); border: 0.5px solid var(--border); }
    table.report-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--bg-primary); }
    table.report-table thead tr { background: var(--bg-secondary); }
    table.report-table th { text-align: left; padding: 9px 14px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); border-bottom: 0.5px solid var(--border); white-space: nowrap; }
    table.report-table td { padding: 9px 14px; border-bottom: 0.5px solid var(--border); color: var(--text-primary); vertical-align: middle; }
    table.report-table tr:last-child td { border-bottom: none; }
    table.report-table tr:hover td { background: var(--bg-secondary); }
    .td-code { font-family: monospace; font-size: 11px; color: var(--text-secondary); white-space: nowrap; }
    .td-dif { font-size: 11px; color: var(--text-secondary); font-style: italic; }
    .td-hora { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .realtime-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255,255,255,0.5); }
    .pulse { width: 6px; height: 6px; border-radius: 50%; background: #1D9E75; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }

    /* Camera scanner */
    .cam-btn { height:38px; padding:0 16px; background:var(--bg-secondary); color:var(--text-primary); border:0.5px solid var(--border-md); border-radius:var(--radius-md); font-size:13px; font-weight:500; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap; }
    .cam-btn:hover { background:var(--bg-tertiary); }
    .cam-btn.active { background:#1a1a2e; color:#e2c94e; border-color:#1a1a2e; }
    .cam-overlay { display:none; margin-top:14px; border-radius:var(--radius-md); overflow:hidden; position:relative; background:#000; }
    .cam-overlay.show { display:block; }
    .cam-overlay video { width:100%; display:block; max-height:280px; object-fit:cover; }
    .cam-overlay canvas { display:none; }
    .cam-aim { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:200px; height:200px; pointer-events:none; }
    .cam-aim::before, .cam-aim::after { content:''; position:absolute; width:36px; height:36px; border-color:#e2c94e; border-style:solid; }
    .cam-aim::before { top:0; left:0; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
    .cam-aim::after  { bottom:0; right:0; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
    .cam-aim-tr { position:absolute; top:0; right:0; width:36px; height:36px; border-top:3px solid #e2c94e; border-right:3px solid #e2c94e; border-radius:0 4px 0 0; }
    .cam-aim-bl { position:absolute; bottom:0; left:0; width:36px; height:36px; border-bottom:3px solid #e2c94e; border-left:3px solid #e2c94e; border-radius:0 0 0 4px; }
    .cam-status { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,0.55); color:#fff; font-size:12px; text-align:center; padding:7px; }
    .cam-status.found { background:rgba(29,158,117,0.85); font-weight:600; }

    /* Eventos */
    .ev-toolbar { display:flex; gap:8px; margin-bottom:16px; align-items:center; flex-wrap:wrap; }
    .ev-toolbar select { flex:1; min-width:160px; height:36px; padding:0 10px; border:0.5px solid var(--border-md); border-radius:var(--radius-md); background:var(--bg-primary); color:var(--text-primary); font-size:13px; }
    .ev-card { background:var(--bg-primary); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:16px; margin-bottom:10px; cursor:pointer; transition:border-color .15s; }
    .ev-card:hover { border-color:#e2c94e; }
    .ev-card-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .ev-card-fecha { font-size:11px; font-weight:600; letter-spacing:0.05em; color:var(--text-secondary); margin-bottom:2px; }
    .ev-card-nombre { font-size:15px; font-weight:600; color:var(--text-primary); }
    .ev-card-festejado { font-size:12px; color:var(--text-secondary); margin-top:2px; }
    .ev-card-pack { font-size:12px; color:var(--text-secondary); margin-top:1px; font-style:italic; }
    .ev-card-prog { display:flex; align-items:center; gap:8px; margin-top:10px; }
    .ev-mini-bar { flex:1; height:5px; background:var(--bg-tertiary); border-radius:3px; overflow:hidden; }
    .ev-mini-fill { height:100%; background:#1D9E75; border-radius:3px; transition:width .3s; }
    .ev-mini-label { font-size:11px; color:var(--text-secondary); white-space:nowrap; }
    .badge-pagado    { background:#EAF3DE; color:#3B6D11; }
    .badge-pendiente { background:#FAEEDA; color:#854F0B; }
    .badge-bloqueado { background:#E6F1FB; color:#185FA5; }
    .ev-modal-backdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; }
    .ev-modal-backdrop.show { display:block; }
    .ev-modal { display:none; position:fixed; bottom:0; left:0; right:0; max-height:92vh; background:var(--bg-primary); border-radius:var(--radius-lg) var(--radius-lg) 0 0; z-index:201; overflow-y:auto; padding:20px 16px 40px; }
    .ev-modal.show { display:block; }
    .ev-modal-header { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:14px; }
    .ev-modal-titulo { font-size:16px; font-weight:600; color:var(--text-primary); }
    .ev-modal-sub { font-size:13px; color:var(--text-secondary); margin-top:3px; }
    .ev-modal-close { background:var(--bg-secondary); border:0.5px solid var(--border-md); border-radius:var(--radius-md); padding:7px 10px; cursor:pointer; color:var(--text-secondary); font-size:16px; flex-shrink:0; }
    .ev-modal-close:hover { color:var(--text-primary); }
    .ev-progress-wrap { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
    .ev-progress-bar { flex:1; height:8px; background:var(--bg-tertiary); border-radius:4px; overflow:hidden; }
    .ev-progress-fill { height:100%; background:#1D9E75; border-radius:4px; transition:width .4s; }
    .ev-progress-label { font-size:12px; color:var(--text-secondary); white-space:nowrap; }
    .ev-operador-row { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
    .ev-check-item { background:var(--bg-secondary); border-radius:var(--radius-md); padding:11px 12px; display:flex; align-items:center; gap:10px; margin-bottom:6px; border:0.5px solid var(--border); }
    .ev-check-item.fuera { border-color:#EF9F27; background:var(--amber-bg); }
    .ev-check-item.completo { border-color:#1D9E75; background:var(--green-bg); opacity:0.75; }
    .ev-check-icon { width:30px; height:30px; border-radius:var(--radius-md); display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; background:var(--bg-tertiary); color:var(--text-secondary); }
    .ev-check-icon.fuera { background:var(--amber-bg); color:var(--amber-text); }
    .ev-check-icon.completo { background:var(--green-bg); color:var(--green-text); }
    .ev-check-info { flex:1; min-width:0; }
    .ev-check-nombre { font-size:13px; font-weight:500; color:var(--text-primary); }
    .ev-check-tipo { font-size:11px; color:var(--text-secondary); }
    .ev-check-btns { display:flex; gap:5px; flex-shrink:0; }
    .ev-btn-e { padding:6px 11px; background:var(--red-bg); color:var(--red-text); border:none; border-radius:var(--radius-md); font-size:12px; font-weight:500; cursor:pointer; }
    .ev-btn-e:hover { filter:brightness(0.93); }
    .ev-btn-r { padding:6px 11px; background:var(--green-bg); color:var(--green-text); border:none; border-radius:var(--radius-md); font-size:12px; font-weight:500; cursor:pointer; }
    .ev-btn-r:hover { filter:brightness(0.93); }

    .qr-toolbar { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
    .qr-search { flex:1; min-width:180px; height:36px; padding:0 12px; border:0.5px solid var(--border-md); border-radius:var(--radius-md); background:var(--bg-primary); color:var(--text-primary); font-size:13px; }
    .qr-search:focus { outline:none; border-color:#e2c94e; box-shadow:0 0 0 2px rgba(226,201,78,0.2); }
    .qr-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(175px,1fr)); gap:12px; }
    .qr-card { background:var(--bg-primary); border:0.5px solid var(--border); border-radius:var(--radius-lg); padding:16px 12px 12px; display:flex; flex-direction:column; align-items:center; gap:6px; }
    .qr-card canvas { border-radius:4px; display:block; }
    .qr-card-code { font-family:monospace; font-size:10px; font-weight:600; color:var(--text-secondary); letter-spacing:0.07em; text-align:center; }
    .qr-card-name { font-size:12px; font-weight:500; color:var(--text-primary); text-align:center; line-height:1.3; }
    .qr-card-dif  { font-size:11px; color:var(--text-secondary); font-style:italic; text-align:center; }
    .qr-dl-btn { display:flex; align-items:center; gap:4px; padding:5px 12px; background:var(--bg-secondary); border:0.5px solid var(--border-md); border-radius:var(--radius-md); font-size:11px; color:var(--text-secondary); cursor:pointer; margin-top:2px; }
    .qr-dl-btn:hover { color:var(--text-primary); }
    @media print {
      .topbar,.stats,.tab-bar,.qr-toolbar,.qr-dl-btn,.dl-btn { display:none !important; }
      #tab-scan,#tab-log,#tab-inv,#tab-report { display:none !important; }
      #tab-qr { display:block !important; }
      .qr-grid { grid-template-columns:repeat(4,1fr); gap:10px; }
      .qr-card { break-inside:avoid; border:1px solid #bbb; padding:12px 8px 8px; }
      body { background:#fff; }
      .container { padding:8px; max-width:100%; }
    }
  </style>
</head>
<body>

<div class="topbar">
  <span class="logo">🎮 CumpleGamer — Inventario</span>
  <div class="topbar-right">
    <span class="realtime-badge" id="rt-badge"><span class="conn-dot" id="conn-dot"></span> Conectando...</span>
    <span class="sync-time" id="sync-time">Sin sync</span>
    <button class="sync-btn" id="sync-btn" onclick="syncInventario(true)">
      <i class="ti ti-refresh"></i> Sincronizar planilla
    </button>
  </div>
</div>

<div class="container">
  <div class="stats">
    <div class="stat"><div class="stat-label">Total</div><div class="stat-val" id="stat-total">—</div></div>
    <div class="stat"><div class="stat-label">Disponibles</div><div class="stat-val green" id="stat-disp">—</div></div>
    <div class="stat"><div class="stat-label">En uso</div><div class="stat-val amber" id="stat-uso">—</div></div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBzIb_cGxmS43Xyz5vLtiNgyXm1tA7Zp9U",
    authDomain: "cumple-gamer.firebaseapp.com",
    projectId: "cumple-gamer",
    storageBucket: "cumple-gamer.firebasestorage.app",
    messagingSenderId: "489208760103",
    appId: "1:489208760103:web:3c7924d36952ada6284b02"
  };

  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSRao9gCsD0yBe80DQgBQokKGEXl1fYfWbGs23FGayz0dZost7E22PRmG1jEH_ylyCB7LvjYpcnxVVz/pub?output=csv';

  let inventory  = [];
  let log        = [];
  let statusMap  = {};
  let foundItem  = null;
  let activeTab  = 'scan';

  const now     = () => new Date();
  const fmtDate = d => d.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'});
  const fmtTime = d => d.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  const esc     = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  // ── Firestore: escuchar movimientos en tiempo real (definido más abajo junto a eventos) ──

  function setConnStatus(online) {
    const dot   = document.getElementById('conn-dot');
    const badge = document.getElementById('rt-badge');
    if (!dot || !badge) return;
    if (online) {
      dot.className = 'conn-dot online';
      badge.innerHTML = '<span class="conn-dot online"></span> Tiempo real';
    } else {
      dot.className = 'conn-dot offline';
      badge.innerHTML = '<span class="conn-dot offline"></span> Sin conexión';
    }
  }

  // ── Google Sheets ───────────────────────────────────────────────────────────
  function parseCSV(text) {
    const lines = text.trim().split(/\r?\n/);
    if (lines.length < 2) return { headers:[], rows:[] };
    const parseRow = row => {
      const res=[]; let inQ=false, cur='';
      for (let i=0;i<row.length;i++) {
        const ch=row[i];
        if (ch==='"'){inQ=!inQ;}
        else if (ch===','&&!inQ){res.push(cur.trim());cur='';}
        else{cur+=ch;}
      }
      res.push(cur.trim());
      return res;
    };
    return { headers: parseRow(lines[0]), rows: lines.slice(1).map(parseRow).filter(r=>r.some(c=>c)) };
  }

  window.syncInventario = async function(manual=false) {
    const btn    = document.getElementById('sync-btn');
    const timeEl = document.getElementById('sync-time');
    const errBox = document.getElementById('scan-err');
    const loadEl = document.getElementById('scan-loading');
    btn.classList.add('loading');
    btn.innerHTML = '<span class="spinner"></span> Sincronizando...';
    errBox.classList.remove('show');
    if (!manual) loadEl.style.display = 'block';
    try {
      const resp = await fetch(CSV_URL + '&_=' + Date.now());
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const text = await resp.text();
      const { headers, rows } = parseCSV(text);
      const iCod  = headers.findIndex(h=>h.trim()==='CODIGO');
      const iItem = headers.findIndex(h=>h.trim()==='ITEM MARCA_');
      const iDif  = headers.findIndex(h=>h.trim()==='Diferenciador');
      const iCant = headers.findIndex(h=>h.trim()==='Cantidad');
      if (iCod < 0) throw new Error('No se encontró la columna CODIGO.');
      inventory = rows
        .filter(r=>r[iCod]&&r[iCod].trim())
        .map(r=>({
          codigo:        (r[iCod]||'').trim().toUpperCase(),
          nombre:        (r[iItem]||'').trim(),
          diferenciador: (iDif>=0?(r[iDif]||'').trim():''),
          cantidad:      (iCant>=0?(r[iCant]||'1').trim():'1'),
          estado:        statusMap[(r[iCod]||'').trim().toUpperCase()] || 'disponible'
        }));
      populateItemFilter();
      updateStats();
      timeEl.textContent = 'Planilla: ' + fmtTime(now()) + ' · ' + inventory.length + ' art.';
      if (manual) {
        const rb = document.getElementById('result-box');
        document.getElementById('res-code').textContent = '';
        document.getElementById('res-name').textContent = '✓ Planilla sincronizada';
        document.getElementById('res-dif').textContent  = inventory.length + ' artículos cargados';
        document.getElementById('res-cant').textContent = '';
        document.getElementById('res-badge').textContent = '';
        document.getElementById('res-badge').className = 'badge';
        document.getElementById('btn-egreso').classList.add('btn-disabled');
        document.getElementById('btn-regreso').classList.add('btn-disabled');
        document.getElementById('res-msg').style.display = 'none';
        rb.classList.add('show');
        foundItem = null;
      }
    } catch(e) {
      errBox.textContent = 'No se pudo cargar la planilla: ' + e.message;
      errBox.classList.add('show');
      timeEl.textContent = 'Error al sincronizar planilla';
    } finally {
      btn.classList.remove('loading');
      btn.innerHTML = '<i class="ti ti-refresh"></i> Sincronizar planilla';
      loadEl.style.display = 'none';
    }
  };

  function populateItemFilter() {
    const items = [...new Set(inventory.map(i=>i.nombre))].sort();
    const sel = document.getElementById('filter-item');
    sel.innerHTML = '<option value="">Todos los items</option>' +
      items.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');
    if (activeTab === 'qr') renderQR();
  }

  function updateStats() {
    const disp  = inventory.filter(i=>i.estado==='disponible').length;
    const uso   = inventory.filter(i=>i.estado==='en_uso').length;
    const today = fmtDate(now());
    const mov   = log.filter(l=>l.fecha===today).length;
    document.getElementById('stat-total').textContent = inventory.length;
    document.getElementById('stat-disp').textContent  = disp;
    document.getElementById('stat-uso').textContent   = uso;
    document.getElementById('stat-mov').textContent   = mov;
    const afuera = log.filter(l=>l.tipo==='egreso'&&!l.reingresado).length;
    const al = document.getElementById('alert-banner');
    if (afuera > 0) {
      al.textContent = '⚠ ' + afuera + ' artículo(s) fuera sin reingreso registrado.';
      al.classList.add('show');
    } else { al.classList.remove('show'); }
  }

  // ── Cámara QR ───────────────────────────────────────────────────────────────
  let camStream = null;
  let camAnimFrame = null;
  let camCooldown = false;

  window.toggleCamara = async function() {
    const overlay = document.getElementById('cam-overlay');
    const btn     = document.getElementById('cam-btn');
    if (camStream) {
      detenerCamara();
      return;
    }
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      const video = document.getElementById('cam-video');
      video.srcObject = camStream;
      await video.play();
      overlay.classList.add('show');
      btn.classList.add('active');
      btn.innerHTML = '<i class="ti ti-camera-off"></i> Cerrar';
      escanearFrame();
    } catch(e) {
      const errBox = document.getElementById('scan-err');
      errBox.textContent = 'No se pudo acceder a la cámara: ' + (e.message || e);
      errBox.classList.add('show');
    }
  };

  function detenerCamara() {
    if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream = null; }
    if (camAnimFrame) { cancelAnimationFrame(camAnimFrame); camAnimFrame = null; }
    const video = document.getElementById('cam-video');
    if (video) video.srcObject = null;
    document.getElementById('cam-overlay')?.classList.remove('show');
    const btn = document.getElementById('cam-btn');
    if (btn) { btn.classList.remove('active'); btn.innerHTML = '<i class="ti ti-camera"></i> Cámara'; }
    document.getElementById('cam-status').textContent = 'Apuntá al QR del artículo';
    document.getElementById('cam-status').classList.remove('found');
  }

  function escanearFrame() {
    const video  = document.getElementById('cam-video');
    const canvas = document.getElementById('cam-canvas');
    const status = document.getElementById('cam-status');
    if (!camStream || !video || video.readyState < 2) {
      camAnimFrame = requestAnimationFrame(escanearFrame);
      return;
    }
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0);
    if (!camCooldown && typeof jsQR !== 'undefined') {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const qr = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      if (qr && qr.data) {
        camCooldown = true;
        const codigo = qr.data.trim().toUpperCase();
        status.textContent = '✓ Detectado: ' + codigo;
        status.classList.add('found');
        document.getElementById('codigo-input').value = codigo;
        // vibrar si está disponible
        if (navigator.vibrate) navigator.vibrate(120);
        setTimeout(() => {
          detenerCamara();
          window.buscarArticulo();
          camCooldown = false;
        }, 600);
        return;
      }
    }
    camAnimFrame = requestAnimationFrame(escanearFrame);
  }

  // Detener cámara al cambiar de tab — manejado en la versión final de showTab

  window.buscarArticulo = function() {
    const codigo = document.getElementById('codigo-input').value.trim().toUpperCase();
    document.getElementById('scan-err').classList.remove('show');
    document.getElementById('res-msg').style.display = 'none';
    if (!codigo) return;
    const item = inventory.find(i=>i.codigo===codigo);
    if (!item) {
      showResult({ codigo, nombre:'Artículo no encontrado', diferenciador:'Verificá el código o sincronizá si lo acabás de agregar.', cantidad:'', estado:null }, true);
      foundItem = null;
      return;
    }
    foundItem = item;
    showResult(item, false);
  };

  function showResult(item, noAction) {
    document.getElementById('res-code').textContent = item.codigo;
    document.getElementById('res-name').textContent = item.nombre;
    document.getElementById('res-dif').textContent  = item.diferenciador || '';
    document.getElementById('res-cant').textContent = item.cantidad ? 'Cantidad: ' + item.cantidad : '';
    const badge = document.getElementById('res-badge');
    const btnE  = document.getElementById('btn-egreso');
    const btnR  = document.getElementById('btn-regreso');
    if (noAction || !item.estado) {
      badge.textContent=''; badge.className='badge';
      btnE.classList.add('btn-disabled'); btnR.classList.add('btn-disabled');
    } else if (item.estado==='disponible') {
      badge.textContent='Disponible'; badge.className='badge badge-green';
      btnE.classList.remove('btn-disabled'); btnR.classList.add('btn-disabled');
    } else {
      badge.textContent='En uso'; badge.className='badge badge-amber';
      btnE.classList.add('btn-disabled'); btnR.classList.remove('btn-disabled');
    }
    document.getElementById('result-box').classList.add('show');
  }

  function refreshResultBadge() {
    if (!foundItem) return;
    const badge = document.getElementById('res-badge');
    const btnE  = document.getElementById('btn-egreso');
    const btnR  = document.getElementById('btn-regreso');
    if (foundItem.estado === 'disponible') {
      badge.textContent='Disponible'; badge.className='badge badge-green';
      btnE.classList.remove('btn-disabled'); btnR.classList.add('btn-disabled');
    } else {
      badge.textContent='En uso'; badge.className='badge badge-amber';
      btnE.classList.add('btn-disabled'); btnR.classList.remove('btn-disabled');
    }
  }

  window.registrarMovimiento = async function(tipo) {
    if (!foundItem) return;
    const operador = document.getElementById('operador-select').value;
    const msg = document.getElementById('res-msg');
    if (!operador) {
      msg.textContent='Seleccioná un operador antes de registrar.';
      msg.style.color='#E24B4A'; msg.style.display='block';
      return;
    }
    const ahora = now();

    // Calcular reingresado: si es egreso = false; si es regreso, marcar el egreso anterior
    const entry = {
      codigo:        foundItem.codigo,
      nombre:        foundItem.nombre,
      diferenciador: foundItem.diferenciador || '',
      tipo,
      operador,
      fecha:         fmtDate(ahora),
      hora:          fmtTime(ahora),
      ts:            ahora.toISOString(),
      reingresado:   false
    };

    try {
      // Si es reingreso, marcar el egreso anterior como reingresado
      if (tipo === 'regreso') {
        const egresoAnterior = log.find(l=>l.codigo===foundItem.codigo&&l.tipo==='egreso'&&!l.reingresado);
        if (egresoAnterior && egresoAnterior.firestoreId) {
          await setDoc(doc(db,'movimientos',egresoAnterior.firestoreId), { reingresado: true }, { merge: true });
        }
      }
      await addDoc(collection(db,'movimientos'), entry);

      msg.textContent = tipo==='egreso'
        ? '✓ Egreso guardado a las '+fmtTime(ahora)+' por '+operador
        : '✓ Reingreso guardado a las '+fmtTime(ahora)+' por '+operador;
      msg.style.color = tipo==='egreso' ? '#E24B4A' : '#1D9E75';
      msg.style.display = 'block';
      // El listener onSnapshot actualizará el estado automáticamente
    } catch(e) {
      msg.textContent = 'Error al guardar: ' + e.message;
      msg.style.color = '#E24B4A';
      msg.style.display = 'block';
    }
  };

  function renderLog() {
    const fOp   = document.getElementById('filter-op').value;
    const fTipo = document.getElementById('filter-tipo').value;
    let entries = log;
    if (fOp)   entries = entries.filter(l=>l.operador===fOp);
    if (fTipo) entries = entries.filter(l=>l.tipo===fTipo);
    const el = document.getElementById('log-list');
    if (!entries.length) {
      el.innerHTML='<div class="no-results"><i class="ti ti-history"></i>Sin registros aún</div>';

  // ── QR · formato Niimbot D110 40×15 mm ─────────────────────────────────
  // A 8px/mm → 40mm=320px, 15mm=120px (renderizado a doble densidad: 640×240)
  const QR_W = 640; // px canvas (2× para nitidez)
  const QR_H = 240;
  const QR_SIZE = 200; // tamaño del módulo QR dentro del canvas
  const QR_MARGIN = 12; // margen izquierdo del QR

  function buildEtiquetaCanvas(codigo, srcImg) {
    const item   = inventory.find(i => i.codigo === codigo);
    const nombre = item ? item.nombre : codigo;
    const dif    = item ? (item.diferenciador || '') : '';

    const c   = document.createElement('canvas');
    c.width   = QR_W;
    c.height  = QR_H;
    const ctx = c.getContext('2d');

    // Fondo blanco
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, QR_W, QR_H);

    // QR a la izquierda (cuadrado, centrado verticalmente)
    const qrY = (QR_H - QR_SIZE) / 2;
    if (srcImg) ctx.drawImage(srcImg, QR_MARGIN, qrY, QR_SIZE, QR_SIZE);

    // Texto a la derecha
    const textX  = QR_MARGIN + QR_SIZE + 18;
    const textW  = QR_W - textX - 12;
    ctx.textAlign    = 'left';
    ctx.textBaseline = 'middle';

    // Código (monospace, pequeño, gris)
    ctx.font      = 'bold 20px monospace';
    ctx.fillStyle = '#888888';
    ctx.fillText(codigo, textX, 52, textW);

    // Nombre (bold, negro, tamaño adaptativo)
    const fontSize = nombre.length > 18 ? 22 : 26;
    ctx.font      = `bold ${fontSize}px sans-serif`;
    ctx.fillStyle = '#1a1a2e';
    // Wrap en 2 líneas si es largo
    const words  = nombre.split(' ');
    let line1 = '', line2 = '';
    let tmp = '';
    for (const w of words) {
      const test = tmp ? tmp + ' ' + w : w;
      ctx.font = `bold ${fontSize}px sans-serif`;
      if (ctx.measureText(test).width > textW && tmp) { line1 = tmp; tmp = w; }
      else { tmp = test; }
    }
    if (!line1) { line1 = tmp; line2 = ''; }
    else { line2 = tmp; }

    if (line2) {
      ctx.fillText(line1, textX, 115, textW);
      ctx.fillText(line2, textX, 150, textW);
    } else {
      ctx.fillText(line1, textX, 130, textW);
    }

    // Diferenciador (itálica, gris)
    if (dif) {
      ctx.font      = `italic 19px sans-serif`;
      ctx.fillStyle = '#666666';
      ctx.fillText(dif.substring(0, 28), textX, line2 ? 188 : 170, textW);
    }

    // Línea decorativa izquierda del texto
    ctx.fillStyle = '#e2c94e';
    ctx.fillRect(textX - 10, 20, 3, QR_H - 40);

    return c;
  }

  // Genera el canvas de etiqueta 40×15mm directamente con QR dibujado en canvas
  // sin depender de imágenes DOM (evita problemas CORS en Android)
  function gerarEtiquetaCanvas(codigo, item, callback) {
    // Generar QR en canvas offscreen usando qrcodejs2 pero extrayendo el canvas nativo
    const offDiv = document.createElement('div');
    offDiv.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0;pointer-events:none;';
    document.body.appendChild(offDiv);

    new QRCode(offDiv, {
      text: codigo, width: 200, height: 200,
      colorDark: '#1a1a2e', colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    setTimeout(() => {
      // qrcodejs2 crea un <canvas> (en navegadores modernos) o un <img>
      const qrCanvas = offDiv.querySelector('canvas');
      const qrImg   = offDiv.querySelector('img');

      const buildCanvas = (qrSrc) => {
        const etiqueta = buildEtiquetaCanvas(codigo, qrSrc);
        document.body.removeChild(offDiv);
        callback(etiqueta);
      };

      if (qrCanvas) {
        buildCanvas(qrCanvas);
      } else if (qrImg) {
        // Redibujar en canvas para evitar restricción CORS
        const tmpC = document.createElement('canvas');
        tmpC.width = tmpC.height = 200;
        const tmpCtx = tmpC.getContext('2d');
        const tmpImg = new Image();
        tmpImg.crossOrigin = 'anonymous';
        tmpImg.onload = () => { tmpCtx.drawImage(tmpImg, 0, 0); buildCanvas(tmpC); };
        tmpImg.onerror = () => {
          // último recurso: dibujar QR directamente sin imagen
          tmpCtx.fillStyle = '#fff';
          tmpCtx.fillRect(0,0,200,200);
          document.body.removeChild(offDiv);
          callback(buildEtiquetaCanvas(codigo, tmpC));
        };
        tmpImg.src = qrImg.src;
      } else {
        document.body.removeChild(offDiv);
        alert('No se pudo generar el QR. Recargá la página e intentá de nuevo.');
      }
    }, 450);
  }

  // Descarga lote — abre página con todas las etiquetas para guardar desde mobile
  window.descargarLoteQR = async function() {
    const q = (document.getElementById('qr-search')?.value || '').toLowerCase();
    let items = inventory;
    if (q) items = items.filter(i =>
      i.codigo.toLowerCase().includes(q) ||
      i.nombre.toLowerCase().includes(q) ||
      (i.diferenciador||'').toLowerCase().includes(q)
    );
    if (!items.length) { alert('No hay artículos para descargar.'); return; }

    const btn = document.querySelector('[onclick="descargarLoteQR()"]');
    if (btn) { btn.textContent = 'Generando...'; btn.style.pointerEvents = 'none'; }

    // Generar todos los canvas en secuencia y acumular dataURLs
    const results = [];
    for (const item of items) {
      await new Promise(resolve => {
        gerarEtiquetaCanvas(item.codigo, item, (canvas) => {
          results.push({ codigo: item.codigo, nombre: item.nombre, dif: item.diferenciador||'', url: canvas.toDataURL('image/png') });
          resolve();
        });
      });
    }

    if (btn) { btn.innerHTML = '<i class="ti ti-download"></i> Lote PNG'; btn.style.pointerEvents = ''; }

    // Abrir página con todas las imágenes — el usuario las guarda una por una o usa "guardar página"
    const win = window.open('', '_blank');
    if (!win) { alert('El navegador bloqueó la ventana emergente. Permitila para esta página.'); return; }
    const imgsHTML = results.map(r => `
      <div style="break-inside:avoid;text-align:center;margin-bottom:12px;">
        <img src="${r.url}" style="width:320px;max-width:95vw;border-radius:6px;display:block;margin:0 auto 4px;">
        <div style="font-size:11px;color:#888;font-family:monospace;">${esc(r.codigo)} · ${esc(r.nombre)}</div>
      </div>`).join('');
    win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <title>QR Inventario CumpleGamer</title>
      <style>
        body{margin:0;padding:16px;background:#111;font-family:sans-serif;}
        h2{color:#e2c94e;font-size:15px;margin-bottom:16px;text-align:center;}
        p{color:#888;font-size:12px;text-align:center;margin-bottom:20px;}
        @media print{body{background:#fff;} h2,p{display:none;}}
      </style></head><body>
      <h2>🎮 CumpleGamer — ${results.length} etiquetas QR · 40×15mm</h2>
      <p>Mantené presionada cada imagen para guardarla · O usá Imprimir para imprimirlas todas</p>
      <button onclick="window.print()" style="display:block;margin:0 auto 20px;padding:8px 20px;background:#e2c94e;color:#1a1a2e;border:none;border-radius:6px;font-weight:600;cursor:pointer;">🖨️ Imprimir todo</button>
      ${imgsHTML}
      </body></html>`);
    win.document.close();
  };

    </style></head><body>
    <div class="no-print" style="padding:12px;background:#1a1a2e;color:#e2c94e;font-size:13px;margin-bottom:8px;">
      Etiquetas 40×15 mm · ${items.length} artículos · 
      <button onclick="window.print()" style="background:#e2c94e;color:#1a1a2e;border:none;padding:4px 12px;border-radius:4px;cursor:pointer;font-weight:600;">Imprimir</button>
    </div>
    <div class="page"><div class="grid" id="grid"></div></div>
    <script>
      const items = ${JSON.stringify(items.map(i=>({codigo:i.codigo,nombre:i.nombre,diferenciador:i.diferenciador||''})))};
      const grid  = document.getElementById('grid');
      items.forEach(item => {
        const div = document.createElement('div'); div.className='etiqueta';
        const img = document.createElement('img');
        // Construir etiqueta en canvas
        const qDiv = document.createElement('div');
        qDiv.style.cssText='position:absolute;left:-9999px;';
        document.body.appendChild(qDiv);
        new QRCode(qDiv,{text:item.codigo,width:120,height:120,colorDark:'#1a1a2e',colorLight:'#ffffff',correctLevel:1});
        setTimeout(()=>{
          const src=qDiv.querySelector('img')||qDiv.querySelector('canvas');
          const render=(s)=>{
            const c=document.createElement('canvas');
            c.width=320;c.height=120;
            const ctx=c.getContext('2d');
            ctx.fillStyle='#fff';ctx.fillRect(0,0,320,120);
            ctx.drawImage(s,4,4,112,112);
            ctx.fillStyle='#e2c94e';ctx.fillRect(120,8,2,104);
            const tx=128,tw=184;
            ctx.textAlign='left';ctx.textBaseline='middle';
            ctx.font='bold 13px monospace';ctx.fillStyle='#888';
            ctx.fillText(item.codigo,tx,28,tw);
            const fs=item.nombre.length>16?16:19;
            ctx.font='bold '+fs+'px sans-serif';ctx.fillStyle='#1a1a2e';
            const words=item.nombre.split(' ');let l1='',l2='',tmp='';
            for(const w of words){const t=tmp?tmp+' '+w:w;ctx.font='bold '+fs+'px sans-serif';if(ctx.measureText(t).width>tw&&tmp){l1=tmp;tmp=w;}else{tmp=t;}}
            if(!l1){l1=tmp;}else{l2=tmp;}
            if(l2){ctx.fillText(l1,tx,62,tw);ctx.fillText(l2,tx,84,tw);}else{ctx.fillText(l1,tx,68,tw);}
            if(item.diferenciador){ctx.font='italic 13px sans-serif';ctx.fillStyle='#666';ctx.fillText(item.diferenciador.substring(0,22),tx,l2?104:94,tw);}
            img.src=c.toDataURL('image/png');
          };
          if(src&&src.tagName==='IMG'){const i=new Image();i.onload=()=>render(i);i.src=src.src;}
          else if(src){render(src);}
          document.body.removeChild(qDiv);
        },350);
        div.appendChild(img);grid.appendChild(div);
      });
    <\/script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs2@0.0.2/qrcode.min.js"><\/script>
    </body></html>`);
    win.document.close();
  };

  const API_EVENTOS = 'https://script.google.com/macros/s/AKfycbydMA72LEOSrrc0mzjoWuJcsMALofkZ-iCuVffhzgyb9WDpRSPIpH5s5ToYydKbDD4J/exec';

  let eventos       = [];
  let eventoActual  = null;
  let evStatusMap   = {}; // { "RES-xxx__item__idx": 'egreso'|'regreso' }

  // ── Cargar eventos desde Apps Script ──────────────────────────────────────
  window.cargarEventos = async function(manual = false) {
    const el = document.getElementById('ev-list');
    if (!eventos.length || manual) {
      el.innerHTML = '<div class="load-overlay"><span class="spinner spinner-dark"></span><br>Cargando eventos...</div>';
      try {
        const resp = await fetch(API_EVENTOS + '?sheet=eventos&_=' + Date.now());
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || 'Error desconocido');
        eventos = data.eventos || [];
      } catch(e) {
        el.innerHTML = `<div class="err-box show">No se pudieron cargar los eventos: ${esc(e.message)}</div>`;
        return;
      }
    }
    renderEventos();
  };

  window.renderEventos = function() {
    const filtroEstado = document.getElementById('ev-filter-estado')?.value || '';
    let lista = eventos;
    if (filtroEstado) lista = lista.filter(ev => ev.estado === filtroEstado);
    const el = document.getElementById('ev-list');
    if (!lista.length) {
      el.innerHTML = '<div class="no-results"><i class="ti ti-calendar-off"></i>Sin eventos para mostrar</div>';
      return;
    }
    el.innerHTML = lista.map(ev => {
      const arts      = ev.articulos || [];
      const total     = arts.reduce((s, a) => s + (a.cantidad || 1), 0);
      const egresados = arts.reduce((s, a) => {
        let cnt = 0;
        for (let i = 0; i < (a.cantidad||1); i++) {
          const k = evStatusMap[ev.id + '__' + a.item + '__' + i];
          if (k === 'egreso') cnt++;
        }
        return s + cnt;
      }, 0);
      const reingresos = arts.reduce((s, a) => {
        let cnt = 0;
        for (let i = 0; i < (a.cantidad||1); i++) {
          const k = evStatusMap[ev.id + '__' + a.item + '__' + i];
          if (k === 'regreso') cnt++;
        }
        return s + cnt;
      }, 0);
      const pct   = total > 0 ? Math.round((reingresos / total) * 100) : 0;
      const bCls  = ev.estado === 'Pagado' ? 'badge-pagado' : ev.estado === 'Bloqueado' ? 'badge-bloqueado' : 'badge-pendiente';
      return `
        <div class="ev-card" onclick="abrirEvento('${esc(ev.id)}')">
          <div class="ev-card-top">
            <div>
              <div class="ev-card-fecha"><i class="ti ti-calendar" style="margin-right:4px;" aria-hidden="true"></i>${esc(ev.fecha)} · ${esc(ev.horaInicio)}${ev.horaTermino?' – '+esc(ev.horaTermino):''}</div>
              <div class="ev-card-nombre">${esc(ev.cliente)}</div>
              <div class="ev-card-festejado">🎂 ${esc(ev.festejado)}${ev.edad?' ('+esc(ev.edad)+' años)':''} · ${esc(ev.comuna||'')}</div>
              <div class="ev-card-pack">${esc(ev.pack)}</div>
            </div>
            <span class="badge ${bCls}">${esc(ev.estado)}</span>
          </div>
          <div class="ev-card-prog">
            <div class="ev-mini-bar"><div class="ev-mini-fill" style="width:${pct}%"></div></div>
            <span class="ev-mini-label">${reingresos}/${total} artículos</span>
            ${egresados > 0 ? `<span class="badge badge-amber" style="font-size:10px;">${egresados} fuera</span>` : ''}
          </div>
        </div>`;
    }).join('');
  };

  // ── Abrir modal checklist ────────────────────────────────────────────────
  window.abrirEvento = function(id) {
    eventoActual = eventos.find(ev => ev.id === id);
    if (!eventoActual) return;
    document.getElementById('ev-modal-titulo').textContent = eventoActual.cliente + ' — ' + eventoActual.festejado;
    document.getElementById('ev-modal-sub').textContent    = eventoActual.fecha + ' · ' + eventoActual.horaInicio + (eventoActual.horaTermino?' – '+eventoActual.horaTermino:'') + ' · ' + (eventoActual.direccion||'') + (eventoActual.comuna?', '+eventoActual.comuna:'');
    document.getElementById('ev-modal-backdrop').classList.add('show');
    document.getElementById('ev-modal').classList.add('show');
    renderChecklist();
  };

  window.cerrarEventoModal = function() {
    document.getElementById('ev-modal-backdrop').classList.remove('show');
    document.getElementById('ev-modal').classList.remove('show');
    eventoActual = null;
    renderEventos();
  };

  function renderChecklist() {
    if (!eventoActual) return;
    const arts = eventoActual.articulos || [];
    // Expandir artículos por cantidad (ej: 3x PS5 → 3 filas)
    let filas = [];
    arts.forEach(a => {
      const qty = a.cantidad || 1;
      for (let i = 0; i < qty; i++) {
        filas.push({ ...a, _idx: i, _key: eventoActual.id + '__' + a.item + '__' + i });
      }
    });

    const total      = filas.length;
    const egresados  = filas.filter(f => evStatusMap[f._key] === 'egreso').length;
    const reingresos = filas.filter(f => evStatusMap[f._key] === 'regreso').length;
    const pct        = total > 0 ? Math.round((reingresos / total) * 100) : 0;

    document.getElementById('ev-progress-fill').style.width  = pct + '%';
    document.getElementById('ev-progress-label').textContent = reingresos + '/' + total + ' reingresan · ' + egresados + ' fuera';

    const el = document.getElementById('ev-checklist');
    if (!filas.length) {
      el.innerHTML = '<div class="no-results">Sin artículos registrados para este evento</div>';
      return;
    }

    el.innerHTML = filas.map(f => {
      const st = evStatusMap[f._key] || 'disponible';
      const itemCls  = st === 'egreso' ? 'fuera' : st === 'regreso' ? 'completo' : '';
      const iconCls  = st === 'egreso' ? 'fuera' : st === 'regreso' ? 'completo' : '';
      const iconChar = st === 'egreso' ? '<i class="ti ti-arrow-up-right" aria-hidden="true"></i>'
                     : st === 'regreso'? '<i class="ti ti-check" aria-hidden="true"></i>'
                     : '<i class="ti ti-circle-dashed" aria-hidden="true"></i>';
      const label    = f._idx > 0 ? esc(f.item) + ' <span style="font-size:10px;color:var(--text-secondary);">#'+(f._idx+1)+'</span>' : esc(f.item);
      const disE     = st === 'egreso'  ? 'btn-disabled' : '';
      const disR     = st !== 'egreso'  ? 'btn-disabled' : '';
      return `
        <div class="ev-check-item ${itemCls}" id="evrow-${esc(f._key)}">
          <div class="ev-check-icon ${iconCls}">${iconChar}</div>
          <div class="ev-check-info">
            <div class="ev-check-nombre">${label}</div>
            <div class="ev-check-tipo">${esc(f.tipo||'')}</div>
          </div>
          <div class="ev-check-btns">
            <button class="ev-btn-e ${disE}" onclick="registrarMovEvento('${f._key}','egreso')"><i class="ti ti-arrow-up-right" aria-hidden="true"></i> Salida</button>
            <button class="ev-btn-r ${disR}" onclick="registrarMovEvento('${f._key}','regreso')"><i class="ti ti-arrow-down-left" aria-hidden="true"></i> Ingreso</button>
          </div>
        </div>`;
    }).join('');
  }

  // ── Registrar movimiento desde checklist ─────────────────────────────────
  window.registrarMovEvento = async function(key, tipo) {
    if (!eventoActual) return;
    const operador = document.getElementById('ev-operador').value;
    if (!operador) { alert('Seleccioná un operador antes de registrar.'); return; }

    // key = "RES-xxx__item__idx"
    const parts  = key.split('__');
    const idRes  = parts[0];
    const item   = parts.slice(1, -1).join('__');
    const ahora  = now();

    const entry = {
      codigo:        key,
      nombre:        item,
      diferenciador: eventoActual.cliente + ' · ' + eventoActual.fecha,
      tipo,
      operador,
      fecha:         fmtDate(ahora),
      hora:          fmtTime(ahora),
      ts:            ahora.toISOString(),
      reingresado:   false,
      eventoId:      idRes,
      eventoCliente: eventoActual.cliente,
      eventoFecha:   eventoActual.fecha
    };

    try {
      if (tipo === 'regreso') {
        const anterior = log.find(l => l.codigo === key && l.tipo === 'egreso' && !l.reingresado);
        if (anterior?.firestoreId) {
          await setDoc(doc(db, 'movimientos', anterior.firestoreId), { reingresado: true }, { merge: true });
        }
      }
      await addDoc(collection(db, 'movimientos'), entry);
      evStatusMap[key] = tipo;
      renderChecklist();
    } catch(e) {
      alert('Error al guardar: ' + e.message);
    }
  };

  // Sincronizar evStatusMap con Firestore al recibir snapshot
  function patchEvStatusFromLog() {
    evStatusMap = {};
    // recorrer de más antiguo a más nuevo
    [...log].reverse().forEach(l => {
      if (l.eventoId) {
        evStatusMap[l.codigo] = l.tipo;
      }
    });
    if (activeTab === 'eventos') {
      renderEventos();
      if (eventoActual) renderChecklist();
    }
  }

  // ── showTab (versión final con soporte de eventos y cámara) ─────────────
  window.showTab = function(name, el) {
    if (name !== 'scan') detenerCamara();
    activeTab = name;
    document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.getElementById('tab-'+name).classList.add('active');
    el.classList.add('active');
    if (name === 'log')     renderLog();
    if (name === 'inv')     renderInventario();
    if (name === 'report')  renderReport();
    if (name === 'qr')      renderQR();
    if (name === 'eventos') cargarEventos(false);
  };

  // ── Firestore listener (versión final con soporte de eventos) ───────────
  function initRealtimeListener() {
    const q = query(collection(db, 'movimientos'), orderBy('ts', 'desc'));
    onSnapshot(q,
      snapshot => {
        log = snapshot.docs.map(d => ({ firestoreId: d.id, ...d.data() }));
        statusMap = {};
        [...log].reverse().forEach(e => {
          if (!e.eventoId) statusMap[e.codigo] = e.tipo === 'egreso' ? 'en_uso' : 'disponible';
        });
        inventory.forEach(i => { i.estado = statusMap[i.codigo] || 'disponible'; });
        patchEvStatusFromLog();
        updateStats();
        if (activeTab === 'log')    renderLog();
        if (activeTab === 'report') renderReport();
        if (activeTab === 'inv')    renderInventario();
        if (foundItem) { foundItem.estado = statusMap[foundItem.codigo] || 'disponible'; refreshResultBadge(); }
        setConnStatus(true);
      },
      err => { console.error('Firestore error:', err); setConnStatus(false); }
    );
  }

  // ── Exportar listado Excel (datos + columna con el texto del QR) ─────────
  window.exportarExcelQR = function() {
    const q = (document.getElementById('qr-search')?.value || '').toLowerCase();
    let items = inventory;
    if (q) items = items.filter(i =>
      i.codigo.toLowerCase().includes(q) ||
      i.nombre.toLowerCase().includes(q) ||
      (i.diferenciador||'').toLowerCase().includes(q)
    );
    if (!items.length) { alert('No hay artículos para exportar.'); return; }

    // SpreadsheetML (XML) — abre nativo en Excel, sin librerías externas,
    // sin riesgo de romper el resto de la app.
    const headerCells = ['Código','Artículo','Diferenciador','Cantidad']
      .map(h => `<Cell ss:StyleID="hdr"><Data ss:Type="String">${esc(h)}</Data></Cell>`).join('');
    const bodyRows = items.map(i => {
      const cells = [i.codigo, i.nombre, i.diferenciador||'', String(i.cantidad||1)]
        .map(v => `<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`).join('');
      return `<Row>${cells}</Row>`;
    }).join('');

    const xml = `<?xml version="1.0" encoding="UTF-8"?>
<?mso-application progid="Excel.Sheet"?>
<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"
  xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
  <Styles>
    <Style ss:ID="hdr">
      <Font ss:Bold="1" ss:Color="#E2C94E"/>
      <Interior ss:Color="#1A1A2E" ss:Pattern="Solid"/>
    </Style>
  </Styles>
  <Worksheet ss:Name="Inventario QR">
    <Table>
      <Row>${headerCells}</Row>
      ${bodyRows}
    </Table>
  </Worksheet>
</Workbook>`;

    const blob = new Blob([xml], { type: 'application/vnd.ms-excel;charset=utf-8;' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'CumpleGamer_Inventario_' + new Date().toISOString().slice(0,10) + '.xls';
    a.click();
    URL.revokeObjectURL(a.href);

    // Aviso sobre los QR como imágenes
    setTimeout(() => {
      alert('Este archivo trae el listado completo de códigos.\n\nPara un Excel con los QR como IMÁGENES reales embebidas, pedíselo a Claude directamente en el chat — se genera del lado servidor en segundos y es más confiable que generarlo desde el navegador.');
    }, 300);
  };

  window.descargarCSV = function() {
    const entries = getFilteredLog();
    if (!entries.length) { alert('No hay movimientos para exportar.'); return; }
    const headers = ['Fecha','Hora','Código','Artículo','Diferenciador','Tipo','Operador'];
    const rows = entries.map(e=>[e.fecha,e.hora,e.codigo,e.nombre,e.diferenciador||'',e.tipo==='egreso'?'Egreso':'Reingreso',e.operador]);
    const csv = [headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='CumpleGamer_Movimientos_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
  };

  window.descargarExcel = function() {
    const entries = getFilteredLog();
    if (!entries.length) { alert('No hay movimientos para exportar.'); return; }
    const headers = ['Fecha','Hora','Código','Artículo','Diferenciador','Tipo','Operador'];
    const rows = entries.map(e=>[e.fecha,e.hora,e.codigo,e.nombre,e.diferenciador||'',e.tipo==='egreso'?'Egreso':'Reingreso',e.operador]);
    const xmlRows = [headers,...rows].map(row=>'<Row>'+row.map(v=>`<Cell><Data ss:Type="String">${esc(v)}</Data></Cell>`).join('')+'</Row>').join('');
    const xml = `<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Movimientos"><Table>${xmlRows}</Table></Worksheet></Workbook>`;
    const blob = new Blob([xml],{type:'application/vnd.ms-excel;charset=utf-8;'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='CumpleGamer_Movimientos_'+new Date().toISOString().slice(0,10)+'.xls'; a.click();
  };

  // ── Init ────────────────────────────────────────────────────────────────────
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', () => {
      initRealtimeListener();
      syncInventario(false);
    });
  } else {
    initRealtimeListener();
    syncInventario(false);
  }</script>
</body>
</html>
